<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green Card Quest — 8-bit</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{background:#0b0b14;font-family:"Courier New",monospace;display:flex;align-items:center;justify-content:center;
    padding:14px 12px calc(14px + env(safe-area-inset-bottom));overflow-x:hidden;}

  #wrap{position:relative;width:100%;max-width:420px;
    background:linear-gradient(150deg,#f6dd8a 0%,#d2a43a 38%,#a9801f 70%,#7a5417 100%);
    border-radius:16px;padding:9px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.45),inset 0 0 0 6px #7a5417,
      inset 0 0 0 8px rgba(255,255,255,.18),0 24px 60px rgba(0,0,0,.55);}
  .inner{background:#e7dcbb;border-radius:9px;padding:9px;display:flex;flex-direction:column;gap:9px;
    box-shadow:inset 0 0 0 2px #b89a52;}

  .titlebar{flex:none;height:38px;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:linear-gradient(#f1e6c6,#d7c396);border:2px solid #7a5417;border-radius:7px;
    padding:0 11px;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 0 rgba(0,0,0,.28);}
  .ttl{font-weight:800;font-size:15px;letter-spacing:.2px;color:#2a2212;text-shadow:0 1px 0 rgba(255,255,255,.55);white-space:nowrap;}
  .rkey{font-size:9px;font-weight:700;color:#8a6a2e;letter-spacing:.3px;white-space:nowrap;}
  .rkey b{color:#5a2e0c;}
  .inv{display:flex;gap:3px;}
  .slot{width:19px;height:19px;border-radius:3px;background:#2b2415;border:1.5px solid #6a4f1a;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5);display:block;}
  .slot canvas{width:16px;height:16px;image-rendering:pixelated;display:block;margin:1px auto;}

  .window{flex:none;position:relative;width:100%;aspect-ratio:4/3;border-radius:7px;overflow:hidden;
    border:2px solid #7a5417;background:#6fb7ff;}
  canvas#c{display:block;width:100%;height:100%;image-rendering:pixelated;}
  #hint{position:absolute;top:7px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#ffe9b0;
    background:rgba(0,0,0,.6);padding:4px 11px;border-radius:6px;font-size:10px;font-weight:700;letter-spacing:1.5px;
    pointer-events:none;}

  .textpanel{flex:none;height:142px;overflow:hidden;background:linear-gradient(#f4ecd4,#e7dcbb);
    border:2px solid #7a5417;border-radius:7px;padding:9px 13px;color:#2a2416;position:relative;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6);}
  .ptype{display:flex;align-items:center;gap:8px;font-weight:800;font-size:11px;letter-spacing:1.2px;color:#7a3f12;
    text-transform:uppercase;border-bottom:1.5px solid #c3a862;padding-bottom:5px;margin-bottom:7px;}
  .ptype .yr{margin-left:auto;color:#5a4a1e;letter-spacing:.5px;}
  #msg{font-size:13px;font-weight:700;line-height:1.3;color:#2a2416;letter-spacing:0;}
  #msg b{color:#9a3d14;font-weight:800;}
  #choices{display:flex;gap:9px;margin-top:9px;}
  .cbtn{flex:1;background:linear-gradient(#f3e6bf,#dcc48a);color:#2a2212;border:2px solid #7a5417;border-radius:6px;
    padding:8px 6px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;letter-spacing:.3px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 3px 0 #7a5417;}
  .cbtn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 1px 0 #7a5417;}
  .cbtn small{display:block;font-weight:600;font-size:10px;color:#6a4a1e;margin-top:2px;letter-spacing:0;}
  #tap{position:absolute;right:12px;bottom:10px;font-size:12px;font-weight:800;color:#fff;background:#9a3d14;
    padding:8px 15px;border-radius:7px;letter-spacing:.5px;box-shadow:0 3px 0 #5e240b;text-align:center;white-space:nowrap;}
  .bic{display:inline-block;width:9px;height:10px;fill:#fff;vertical-align:-1px;}
  .pabtn{position:absolute;right:12px;bottom:10px;z-index:3;font-size:12px;font-weight:800;color:#fff;background:#9a3d14;
    padding:8px 15px;border-radius:7px;letter-spacing:.5px;box-shadow:0 3px 0 #5e240b;border:none;cursor:pointer;font-family:inherit;}
  .pabtn:active{transform:translateY(2px);box-shadow:0 1px 0 #5e240b;}

  .loot{flex:none;height:74px;display:flex;align-items:center;gap:9px;
    background:linear-gradient(#f1e6c6,#d7c396);border:2px solid #7a5417;border-radius:7px;padding:0 10px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6);}
  .lootrow{flex:1;display:flex;justify-content:space-between;}
  .lootitem{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .lootitem .pic{width:40px;height:40px;border-radius:5px;background:#2b2415;border:1.5px solid #6a4f1a;
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;}
  .lootitem.on .pic{background:#3a2f14;border-color:#caa23a;box-shadow:inset 0 1px 2px rgba(0,0,0,.4),0 0 8px rgba(202,162,58,.65);}
  .lootitem canvas{width:36px;height:36px;image-rendering:pixelated;display:block;}
  .lootitem .cap{font-size:10.5px;font-weight:800;letter-spacing:.2px;color:#9a8347;}
  .lootitem.on .cap{color:#5a2e0c;}

  .statbar{flex:none;height:34px;display:flex;align-items:center;gap:9px;
    background:linear-gradient(#f1e6c6,#d7c396);border:2px solid #7a5417;border-radius:7px;padding:0 12px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6);}
  .slabel{font-weight:800;font-size:11px;letter-spacing:1px;color:#5a2e0c;text-transform:uppercase;white-space:nowrap;min-width:56px;}
  .maplerow{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;overflow:hidden;}
  .maple{width:18px;height:18px;image-rendering:pixelated;display:block;flex:none;}
  .track{flex:1;height:13px;background:#8a7636;border:2px solid #5a4410;border-radius:3px;overflow:hidden;
    box-shadow:inset 0 2px 3px rgba(0,0,0,.4);}
  .track>i{display:block;height:100%;width:20%;background:#35c666;transition:background .3s;}
  .hyrs{font-size:11px;font-weight:800;color:#2a2212;min-width:56px;text-align:right;letter-spacing:.3px;white-space:nowrap;}

  #win{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:11px;
    background:rgba(8,8,20,.9);color:#fff;text-align:center;z-index:5;border-radius:16px;padding:24px;}
  #win h1{font-size:28px;color:#ffcf2e;letter-spacing:1px;text-shadow:2px 2px 0 #000;}
  #win p{font-size:15px;font-weight:600;color:#e8e3d0;line-height:1.35;max-width:300px;}
  #win p b{color:#ffcf2e;}
  #win button{margin-top:4px;background:#ffcf2e;color:#2a2212;border:3px solid #7a5417;border-radius:6px;padding:11px 20px;
    font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;box-shadow:0 4px 0 #7a5417;}
  #win .rhint{font-size:11px;color:#9a8db8;letter-spacing:.5px;}
  #win .rhint b{color:#ffcf2e;}
</style>
</head>
<body>
  <div id="wrap">
    <div class="inner">
      <div class="titlebar">
        <div class="ttl">GREEN CARD QUEST</div>
      </div>
      <div class="window">
        <canvas id="c"></canvas>
        <div id="hint">▶ TAP = PAUSE / NEXT</div>
        <div id="tap">▶ TAP</div>
      </div>
      <div class="textpanel">
        <div class="ptype"><span id="ptype">STATUS</span><span class="yr" id="pyr"></span></div>
        <div id="msg"></div>
        <div id="choices"></div>
      </div>
      <div class="loot">
        <div class="lootrow" id="lootrow"></div>
      </div>
      <div class="statbar">
        <span class="slabel">Time</span>
        <span class="maplerow" id="maplerow"></span>
        <span class="hyrs" id="yrtext">0 yrs</span>
      </div>
      <div class="statbar">
        <span class="slabel">HP</span>
        <div class="track"><i id="hp"></i></div>
        <span class="hyrs" id="yrs">10 / 10</span>
      </div>
    </div>
    <div id="win">
      <h1 id="wh">Yeah!</h1>
      <p id="wp"></p>
      <button id="again">PLAY AGAIN</button>
      <div class="rhint">or press <b>R</b> to restart</div>
    </div>
  </div>
<script>
(function(){
  "use strict";
  var LW=120, LH=90, T=16;   // 4:3 zoomed-in viewport
  var cv=document.getElementById("c"), g=cv.getContext("2d");
  cv.width=LW; cv.height=LH; g.imageSmoothingEnabled=false;

  // palette
  var SKY="#bfe6ff", CLOUD="#ffffff", GRASS="#a8d84a", GRASS_D="#6fa02a",
      CAVE="#171320", CAVE2="#23202f", LADDER="#9c6a2e", LADDER_D="#6e4a1e",
      FLAG="#35c666", SLIME="#4fd6b5", SLIME_D="#2fae91", SLIME_L="#bff3e6", CHEEK="#ff9fb0", EYE="#20323a";

  // ---- geometry: surface + a staircase mine going down, then a climb shaft back up ----
  var GY=48, GROW=GY/T;                 // grass surface line / row
  // path waypoints (world px) — character's base/feet follow these
  var P=[[32,GY],[208,GY],[368,GY],[496,GY],[496,130],
         [656,130],[656,220],[816,220],[816,310],[1008,310],
         [1008,400],[1184,400],[1184,490],[1360,490],[1360,580],
         [1536,580],[1536,104],[1536,GY],[1584,GY]];   // ...climb up the shaft, then step RIGHT onto solid ground (hole stays in view)
  // which waypoint each story beat sits on
  var START_YEAR=2020;
  var BEATS=[
    {node:1,  year:2020, cap:0, tool:"key", tag:"OPT", msg:"You get your <b>OPT</b> — a key to work. But you must land a <b>job within 90 days</b>, or you fall out of status."},
    {node:2,  year:2021, cap:3, tool:"door", tag:"Hired!", msg:"You land a job in time — a door opens! Your employer takes you on and agrees to sponsor you. Time to head underground."},
    {node:6,  year:2022, dip:1, type:"fork", tool:"coin", tag:"H-1B lottery",
      msg:"<b>H-1B lottery</b> — the shaft forks, and only ~27% get picked. You take your chances…",
      bomb:"<b>2021 — not selected!</b> That tunnel caves in. Your clock keeps ticking — wait a year and try again.",
      winmsg:"<b>2022 — H-1B!</b> Picked on your 2nd try — a gold coin, and <b>6 HP</b> (6 years) to work toward the green card. But every year that passes burns one."},
    {node:9,  year:2023, tool:"gemB", tag:"PERM", msg:"<b>PERM</b> — a blue gem! You pass your <b>PERM</b> labor certification — the first green-card step. That sets your <b>priority date</b>, your spot in the green-card line."},
    {node:11, year:2024, tool:"gemG", tag:"I-140", msg:"<b>I-140</b> — a green gem! Your employer's green-card petition for you is approved."},
    {node:13, year:2025, type:"wait", tag:"The long wait", msg:"The big wait: your <b>priority date</b> must become <b>current</b> (Chart A) before you can file. The years — and your HP — tick down…"},
    {node:15, year:2026, tool:"wings", tag:"I-485 / EAD", msg:"Current! You file <b>I-485</b> and get your <b>EAD + Advance Parole</b> — <b>wings!</b> Advance Parole lets you travel freely. Fly up for your green card!"},
    {node:16, year:2026, cap:10, tool:"greencard", tag:"Approved!", msg:"<b>I-485 APPROVED</b> — you fly up and grab your <b>Green Card</b> at the surface! HP maxed to 10 — you can stay for good."},
    {node:18, year:2026, type:"flag", tag:"Victory", msg:"You climb into daylight a <b>lawful permanent resident</b>."}
  ];
  var FORK_INDEX=2, FORK_NODE=6;

  // build segments + cumulative distances
  var SEG=[], ND=[0];
  for(var i=1;i<P.length;i++){ var x0=P[i-1][0],y0=P[i-1][1],x1=P[i][0],y1=P[i][1];
    var len=Math.hypot(x1-x0,y1-y0); var midY=(y0+y1)/2;
    SEG.push({x0:x0,y0:y0,x1:x1,y1:y1,len:len,vert:Math.abs(x1-x0)<4,carve:midY>GY+2});
    ND.push(ND[i-1]+len); }
  var TOTAL=ND[ND.length-1];
  function nodeDist(n){ return ND[n]; }
  function posAt(d){ d=Math.max(0,Math.min(TOTAL,d));
    for(var i=0;i<SEG.length;i++){ if(d<=ND[i+1]||i===SEG.length-1){ var s=SEG[i], t=s.len?(d-ND[i])/s.len:0;
      return {x:s.x0+(s.x1-s.x0)*t, y:s.y0+(s.y1-s.y0)*t}; } } return {x:P[0][0],y:P[0][1]}; }
  function distSeg(px,py,s){ var dx=s.x1-s.x0, dy=s.y1-s.y0, l2=dx*dx+dy*dy;
    var t=l2?((px-s.x0)*dx+(py-s.y0)*dy)/l2:0; t=Math.max(0,Math.min(1,t));
    var ex=s.x0+dx*t, ey=s.y0+dy*t; return Math.hypot(px-ex,py-ey); }
  // axis-aligned carving → uniform-thickness tunnels that fully contain the slime
  var TUN=14, CEIL=24, FLOORD=4;    // 2*TUN == CEIL+FLOORD  → vertical & horizontal tunnels identical thickness
  function dug(cx,cy){ if(cy<GY) return false;
    for(var i=0;i<SEG.length;i++){ var s=SEG[i]; if(!s.carve) continue;
      if(s.vert){ if(Math.abs(cx-s.x0)<=TUN && cy>=Math.min(s.y0,s.y1)-CEIL && cy<=Math.max(s.y0,s.y1)+FLOORD) return true; }
      else { if(cx>=Math.min(s.x0,s.x1)-TUN && cx<=Math.max(s.x0,s.x1)+TUN && cy>=s.y0-CEIL && cy<=s.y0+FLOORD) return true; } }
    return false; }

  var WORLD_W=1740, WORLD_H=660;
  var EXIT_X=P[P.length-1][0];                 // flag sits here — right of the hole
  var FLAG_NODE=P.length-1, EMERGE_NODE=P.length-2;   // emerge at the hole, then step right to FLAG_NODE

  // ---- state ----
  var hero={x:P[0][0],y:P[0][1],dist:0,hop:0};
  var camX=0, camY=0, cur=0, mode="walk", target=0, hp=0, hpTarget=2, items=[], sparks=[], shake=0;
  var fphase=0, ft=0, bombVisible=false, bombExploded=false;
  var staCap=0, staCapYear=2020;   // stamina refills to staCap when you gain a status, then -1 per year
  var flying=false, crying=false, paused=false;  // flying: after wings; crying: bombed; paused: stop while walking
  var FC=P[FORK_NODE];             // fork junction (arrived going DOWN)
  var STUB=[FC[0], FC[1]+120];     // DOWN dead-end = the failed 2021 shaft (longer; bomb at the bottom)
  var PICKPOS=[FC[0]+96, FC[1]];   // hammer down the RIGHT passage (the way through)

  var windowEl=document.querySelector(".window");
  var msg=document.getElementById("msg"), choicesEl=document.getElementById("choices"), tapEl=document.getElementById("tap"),
      hpEl=document.getElementById("hp"), yrsEl=document.getElementById("yrs"), hintEl=document.getElementById("hint"),
      ptypeEl=document.getElementById("ptype"), pyrEl=document.getElementById("pyr"),
      lootrowEl=document.getElementById("lootrow");

  var TOOLS=[{kind:"key",label:"OPT"},{kind:"door",label:"JOB"},{kind:"coin",label:"H-1B"},{kind:"gemB",label:"PERM"},
             {kind:"gemG",label:"I-140"},{kind:"wings",label:"I-485"},{kind:"greencard",label:"GREEN"}];
  var TOTAL_TOOLS=TOOLS.length;
  var lootCtx=[], lootItems=[];
  TOOLS.forEach(function(t){ var it=document.createElement("div"); it.className="lootitem";
    var pic=document.createElement("div"); pic.className="pic"; var cc=document.createElement("canvas"); cc.width=16; cc.height=16;
    pic.appendChild(cc); var cap=document.createElement("div"); cap.className="cap"; cap.textContent=t.label;
    it.appendChild(pic); it.appendChild(cap); lootrowEl.appendChild(it); lootCtx.push(cc.getContext("2d")); lootItems.push(it); });
  function has(k){ return items.indexOf(k)>=0; }
  function setInv(){ TOOLS.forEach(function(t,i){ lootCtx[i].clearRect(0,0,16,16);
    lootItems[i].classList.toggle("on",has(t.kind)); if(has(t.kind)) lootCtx[i].drawImage(toolImg[t.kind],0,0); }); }
  // measure each icon's bounds so it can be centred in its box / tunnel
  function toolOffset(kind){ var t=document.createElement("canvas"); t.width=16; t.height=16; var c=t.getContext("2d");
    drawTool(c,kind,0,0); var d=c.getImageData(0,0,16,16).data, mnx=16,mny=16,mxx=-1,mxy=-1;
    for(var y=0;y<16;y++)for(var x=0;x<16;x++){ if(d[(y*16+x)*4+3]>0){ if(x<mnx)mnx=x; if(x>mxx)mxx=x; if(y<mny)mny=y; if(y>mxy)mxy=y; } }
    return mxx<0?[0,0]:[Math.round((15-mnx-mxx)/2),Math.round((15-mny-mxy)/2)]; }
  var toolImg={};   // each tool pre-rendered, centred in a 16×16 canvas
  TOOLS.forEach(function(t){ var off=toolOffset(t.kind); var oc=document.createElement("canvas"); oc.width=16; oc.height=16;
    var o=oc.getContext("2d"); o.imageSmoothingEnabled=false; drawTool(o,t.kind,off[0],off[1]); toolImg[t.kind]=oc; });

  var yearsPassed=0, maplerow=document.getElementById("maplerow"), yrtext=document.getElementById("yrtext"), mapleCtx=[];
  for(var mi=0;mi<10;mi++){ var mc=document.createElement("canvas"); mc.width=16; mc.height=16; mc.className="maple"; maplerow.appendChild(mc); mapleCtx.push(mc.getContext("2d")); }
  function drawRock(ctx,on){ ctx.clearRect(0,0,16,16);
    var A=on?"#6b7079":"#cfcbbf", B=on?"#9298a4":"#e0dcd0", D=on?"#474b53":"#b6b2a6";
    function p(c,x,y,w,h){ ctx.fillStyle=c; ctx.fillRect(x,y,w||1,h||1); }
    // boulder body
    p(A,5,3,6,1); p(A,3,4,10,1); p(A,2,5,12,1); p(A,1,6,14,1);
    p(A,1,7,14,2); p(A,2,9,12,1); p(A,2,10,12,1); p(A,3,11,10,1); p(A,5,12,6,1);
    // top-left highlight
    p(B,5,3,4,1); p(B,3,4,4,1); p(B,2,5,3,1); p(B,2,6,2,1);
    // bottom-right shadow + cracks
    p(D,9,10,4,1); p(D,5,11,8,1); p(D,5,12,6,1); p(D,12,7,2,2); p(D,7,6,1,3); p(D,8,8,2,1); }
  function setHUD(){ var pct=Math.max(0,Math.min(10,hp))/10; hpEl.style.width=(pct*100)+"%";
    hpEl.style.background=pct>0.55?"#35c666":pct>0.3?"#e8b53a":"#e23b45"; yrsEl.textContent=Math.round(hp)+" / 10";
    for(var i=0;i<10;i++) drawRock(mapleCtx[i], i<yearsPassed);
    yrtext.textContent=yearsPassed+" yrs"; }
  function docs(){ pyrEl.textContent=(items.length>=TOTAL_TOOLS)?"COMPLETE":(items.length+" / "+TOTAL_TOOLS+" tools"); }
  function collectTool(k){ items.push(k); setInv(); docs(); if(k==="wings") flying=true; burst(hero.x,hero.y-18,"good"); }

  function fireBeat(i){ var b=BEATS[i]; msg.innerHTML=b.msg; ptypeEl.textContent=b.tag||"Status";
    if(b.year!=null) yearsPassed=b.year-START_YEAR;
    if(b.cap!=null){ staCap=b.cap; staCapYear=b.year; }
    hpTarget=Math.max(0,Math.min(10, staCap-((b.year||staCapYear)-staCapYear)));
    if(b.type==="fork"){ startFork(); return; }                 // auto bomb cutscene → Next
    if(b.tool) collectTool(b.tool); docs();
    if(b.type==="flag"){ showEnd(); return; }
    showNext(); }
  function showNext(){ mode="wait"; updateBtn(); }
  function doNext(){ if(cur>=BEATS.length-1){ showEnd(); return; }
    cur++; target=nodeDist(BEATS[cur].node); mode="walk"; paused=false; updateBtn(); }
  function showEnd(){ mode="ending"; tapEl.style.display="none"; if(windowEl.querySelector(".pabtn")) return;
    var pa=document.createElement("button"); pa.className="pabtn"; pa.innerHTML=SVG_PLAY+" PLAY AGAIN";
    pa.onclick=function(){ location.reload(); }; windowEl.appendChild(pa); }
  var SVG_PAUSE='<svg class="bic" viewBox="0 0 10 11"><rect x="0" y="0" width="3.4" height="11"/><rect x="6.6" y="0" width="3.4" height="11"/></svg>';
  var SVG_PLAY='<svg class="bic" viewBox="0 0 10 11"><path d="M0 0 L10 5.5 L0 11 Z"/></svg>';
  function updateBtn(){
    if(mode==="wait" || (mode==="fork"&&fphase===3)){ tapEl.innerHTML="NEXT "+SVG_PLAY; tapEl.style.display="block"; }
    else if(mode==="walk"||mode==="fork"){ tapEl.innerHTML = paused ? (SVG_PLAY+" GO") : (SVG_PAUSE+" PAUSE"); tapEl.style.display="block"; }
    else tapEl.style.display="none"; }

  // fork — auto-played: dig DOWN → bomb → back UP → go RIGHT
  function startFork(){ mode="fork"; fphase=1; ft=0; paused=false; bombVisible=true; bombExploded=false; crying=false; updateBtn(); }
  function showForkWait(){ msg.innerHTML=BEATS[FORK_INDEX].bomb; ptypeEl.textContent="Setback"; }
  function forkWin(){ collectTool("coin"); staCap=6; staCapYear=BEATS[FORK_INDEX].year; hpTarget=6;
    msg.innerHTML=BEATS[FORK_INDEX].winmsg; ptypeEl.textContent="Tool get"; docs();
    hero.dist=nodeDist(FORK_NODE)+(PICKPOS[0]-FC[0]); hero.x=PICKPOS[0]; hero.y=FC[1]; showNext(); }

  function tap(){ if(mode==="wait"){ doNext(); return; }
    if(mode==="fork" && fphase===3){ fphase=4; ft=0; crying=false; msg.innerHTML="You back up and dig <b>right</b> instead…"; updateBtn(); return; }
    if(mode==="walk"||mode==="fork"){ paused=!paused; updateBtn(); } }
  window.addEventListener("pointerdown",function(e){ if(e.target.closest(".pabtn"))return; tap(); });
  window.addEventListener("keydown",function(e){ if(e.code==="Space"){ e.preventDefault(); tap(); }
    else if(e.key==="r"||e.key==="R"){ location.reload(); }});

  function burst(x,y,kind){ var cols=kind==="bad"?["#ff7a1a","#e23b45","#ffcf2e","#9e2730"]:["#ffcf2e","#fff","#35c666","#5b6ee1"];
    for(var i=0;i<18;i++){ var a=(i/18)*Math.PI*2, sp=22+(i%5)*11;
      sparks.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-20,life:.6+(i%4)*.12,c:cols[i%cols.length]}); } }
  function win(){ if(mode==="win")return; mode="win"; tapEl.style.display="none";
    document.getElementById("wp").innerHTML="From OPT to Permanent Resident — it took you <b>"+yearsPassed+" years</b>, 3 status changes, 1 failed H-1B lottery, and 7 milestones dug up. You made it!";
    document.getElementById("win").style.display="flex"; }
  document.getElementById("again").onclick=function(){ location.reload(); };

  // ---- pixel + icons ----
  function px(c,x,y,w,h){ g.fillStyle=c; g.fillRect(x|0,y|0,(w||1),(h||1)); }
  function drawTool(ctx,kind,ox,oy){ function p(c,x,y,w,h){ ctx.fillStyle=c; ctx.fillRect((ox+x)|0,(oy+y)|0,(w||1),(h||1)); }
    if(kind==="hammer"){            // sledgehammer: solid block head + handle
      p("#8a8f99",2,2,12,5); p("#c7ccd4",2,2,12,1); p("#5f656e",2,6,12,1);
      p("#9c6a2e",7,7,2,8); p("#7a4f1e",7,7,1,8); }
    else if(kind==="briefcase"){    // job: briefcase
      p("#6b4a24",6,2,4,2); p("#8a5a2b",2,5,12,9); p("#a86a2e",2,5,12,2); p("#5e3614",2,12,12,2);
      p("#ffcf2e",7,8,2,4); p("#5e3614",2,9,12,1); }
    else if(kind==="pickaxe"){      // pickaxe: curved bar with pointed ends + handle
      p("#9c6a2e",7,6,2,9); p("#7a4f1e",7,6,1,9);
      p("#8a8f99",1,6,14,2); p("#c7ccd4",1,6,14,1); p("#8a8f99",1,4,2,2); p("#8a8f99",13,4,2,2); }
    else if(kind==="lantern"){      // miner's lantern with glow
      p("#6b7280",6,0,4,2); p("#8a8f99",5,1,1,3); p("#8a8f99",10,1,1,3);
      p("#caa23a",4,4,8,10); p("#fff2b0",5,6,6,6); p("#ffcf2e",6,8,4,3);
      p("#6b5320",4,4,8,1); p("#6b5320",4,13,8,1); p("#6b5320",4,9,8,1); }
    else if(kind==="key"){          // key: round bow + shaft + teeth
      p("#ffcf2e",2,3,7,7); p("#2b2415",4,5,3,3); p("#fff0b0",3,4,2,2);
      p("#ffcf2e",9,6,6,2); p("#ffcf2e",12,8,1,3); p("#ffcf2e",14,8,1,2); }
    else if(kind==="shield"){       // shield with cross
      p("#4f8fe0",3,2,10,6); p("#4f8fe0",4,8,8,3); p("#4f8fe0",6,11,4,2);
      p("#bcd8f7",3,2,10,1); p("#fff",7,4,2,7); p("#fff",5,6,6,2); }
    else if(kind==="gem"||kind==="gemB"||kind==="gemR"||kind==="gemG"){   // faceted diamond (colored)
      var c = kind==="gemB"?["#a8c8ff","#3f80e0","#1f468f"] : kind==="gemR"?["#ff8a8a","#e23b45","#9e1f28"] : kind==="gemG"?["#8fe8c4","#2fbf6a","#167a40"] : ["#ffe85a","#f3c21a","#a9810a"];
      p(c[1],5,2,6,1); p(c[0],4,3,8,1); p(c[0],3,4,10,1); p(c[1],3,5,10,1);
      p(c[1],4,6,8,1); p(c[1],5,7,6,1); p(c[2],6,8,4,1); p(c[2],7,9,2,1); p(c[2],7,10,2,1);
      p(c[2],8,3,1,6); p(c[2],5,5,1,2); p(c[2],10,5,1,2); p("#ffffff",4,3,3,1); p(c[0],5,4,4,1); }
    else if(kind==="coin"){          // round yellow coin (H-1B)
      var Y="#ffd21a", L="#fff0a0", D="#cc9a08";
      p(Y,6,3,4,1); p(Y,4,4,8,1); p(Y,3,5,10,1); p(Y,2,6,12,1); p(Y,2,7,12,1); p(Y,2,8,12,1); p(Y,3,9,10,1); p(Y,4,10,8,1); p(Y,6,11,4,1);
      p(L,6,3,3,1); p(L,4,4,3,1); p(L,3,5,2,1);        // top-left highlight
      p(D,9,10,4,1); p(D,6,11,4,1); p(D,13,7,1,2);     // bottom-right shadow
      p(D,7,5,2,1); p(D,7,5,1,5); p(D,8,9,1,1); p(L,8,6,1,2); }   // $ mark
    else if(kind==="wings"){         // wings (EAD / Advance Parole)
      var w="#eef6ff", d="#bcd4ef";
      p(w,4,2,3,2); p(w,2,4,4,2); p(w,1,6,4,2); p(w,1,8,3,1);
      p(w,9,2,3,2); p(w,10,4,4,2); p(w,11,6,4,2); p(w,12,8,3,1);
      p(d,3,5,3,1); p(d,10,5,3,1); p(d,2,7,3,1); p(d,11,7,3,1);
      p("#ffcf2e",7,4,2,7); }
    else if(kind==="door"){          // door (job)
      p("#8a5a2b",3,1,10,14); p("#a86a2e",3,1,10,2); p("#6e4620",3,13,10,2);
      p("#6e4620",4,4,3,3); p("#6e4620",9,4,3,3); p("#6e4620",4,8,3,4); p("#6e4620",9,8,3,4);
      p("#ffcf2e",11,8,2,2); }
    else if(kind==="greencard"){     // the green card
      p("#2aa052",2,3,12,10); p("#5fe0a0",2,3,12,2); p("#1f7a40",2,11,12,2);
      p("#eafff2",3,6,4,5); p("#bfeccd",8,6,5,1); p("#bfeccd",8,8,5,1); p("#bfeccd",8,10,4,1); } }

  // depth-based earth block palette (geological layers)
  function layer(cy){ if(cy<150) return ["#9c5a22","#b06a2c","#733f16"];       // topsoil
    if(cy<320) return ["#7c3f16","#95501e","#5a2e0f"];                          // clay
    if(cy<500) return ["#6a4326","#7e5330","#4c2f18"];                          // deep soil
    return ["#575160","#6b6676","#3c3846"]; }                                   // bedrock
  function hash(a,b){ var n=(a*73856093 ^ b*19349663)>>>0; return n; }

  function drawTileSolid(sxp,syp,tx,ty){
    var wy0=ty*T, cy=wy0+8, pal=layer(cy), base=pal[0], mid=pal[1], lo=pal[2];
    px(base,sxp,syp,T,T);                                    // one continuous fill (no block borders)
    for(var yy=wy0; yy<wy0+T; yy++){ var m=((yy%40)+40)%40;  // continuous horizontal strata layers
      if(m<2) px(lo,sxp,yy-wy0+syp,T,1); else if(m===20) px(mid,sxp,yy-wy0+syp,T,1); }
    var r=hash(tx,ty)%100;
    if(r<8){ px("#c56a1e",sxp+2,syp+6,7,2); px("#ff9a33",sxp+3,syp+7,6,2); px("#c56a1e",sxp+7,syp+9,5,2); }  // ore streak
    else if(r<14){ px(lo,sxp+4,syp+5,5,4); px("#3c3628",sxp+5,syp+6,3,2); }      // small embedded rock
    else if(r<34){ px(lo,sxp+(r%12),syp+((r*5)%13),2,2); }                       // pebble
    else if(r<52){ px(mid,sxp+((r*3)%12),syp+((r*7)%12),2,1); }                  // grain
  }
  // ---- uniform-thickness tunnels drawn as exact rectangles (identical width everywhere) ----
  var TH=24, HH=TH>>1;                       // tunnel thickness / half
  function carveRect(x0,y0,x1,y1){
    if(y1<=GY) return; if(y0<GY) y0=GY;
    var sx=Math.round(x0-camX), sy=Math.round(y0-camY), w=Math.round(x1-x0), h=Math.round(y1-y0);
    if(sx>LW||sx+w<0||sy>LH||sy+h<0) return;
    g.fillStyle=CAVE; g.fillRect(sx,sy,w,h);
    g.fillStyle="#0c0912"; g.fillRect(sx,sy,w,2);           // soft top-edge shadow
  }
  function carveSeg(s){
    if(s.vert) carveRect(s.x0-HH, Math.min(s.y0,s.y1)-HH, s.x0+HH, Math.max(s.y0,s.y1)+HH);
    else carveRect(Math.min(s.x0,s.x1)-HH, s.y0-HH, Math.max(s.x0,s.x1)+HH, s.y0+HH);
  }
  function drawWorld(){
    px(SKY,0,0,LW,LH);
    for(var k=0;k<12;k++){ var cxw=140+k*230, sxp=((cxw-camX*0.4)%(WORLD_W))|0; if(sxp<-40||sxp>LW)continue;
      if(camY>GY) continue; px(CLOUD,sxp,8-camY+(k%2)*8,16,3); px(CLOUD,sxp+4,6-camY+(k%2)*8,9,3); }
    var tx0=Math.floor(camX/T)-1, tx1=Math.ceil((camX+LW)/T)+1, ty0=Math.floor(camY/T)-1, ty1=Math.ceil((camY+LH)/T)+1;
    for(var ty=ty0;ty<=ty1;ty++){ if(ty<GROW) continue; for(var tx=tx0;tx<=tx1;tx++){
      var sxp=tx*T-camX, syp=ty*T-camY; drawTileSolid(sxp,syp,tx,ty);
      if(ty===GROW){ px(GRASS,sxp,syp,T,3); px(GRASS_D,sxp,syp+3,T,2); if((hash(tx,7)%3)===0) px(GRASS,sxp+6,syp-2,2,3); } }
    }
    for(var i=0;i<SEG.length;i++){ if(SEG[i].carve) carveSeg(SEG[i]); }   // carve uniform tunnels over the earth
  }

  function drawFork(){
    // DOWN dead-end stub (the failed 2021 shaft) — same uniform thickness
    carveRect(FC[0]-HH, FC[1]-HH, FC[0]+HH, STUB[1]+HH);
    if(bombVisible) drawBomb(STUB[0]-camX-6, STUB[1]-camY-5);
    if(fphase>=4 && !has("coin")) drawTreasure("coin", PICKPOS[0], PICKPOS[1]);
  }
  function drawBomb(x,y){ px("#2a2a2a",x,y,11,11); px("#000",x+1,y+1,9,9); px("#555",x+2,y+2,3,2);
    px("#6b4a24",x+9,y-3,2,4); if(!bombExploded){ px("#ffcf2e",x+10,y-5,2,2); px("#fff",x+11,y-6,1,1); } }

  function drawHero(){ var sx=hero.x-camX, onSurf=hero.y<=GY+4;
    var b=(hero.y-camY)-hero.hop+(onSurf?0:7);          // feet on grass up top; centered in the tunnel below
    var sq=(mode==="walk"||mode==="fork")?(hero.hop>1?1:-1):0;
    if(onSurf){ g.globalAlpha=.18; px("#000",sx-8,hero.y-camY+1,16,3); g.globalAlpha=1; }
    px(SLIME,sx-9,b-6-sq,18,6+sq); px(SLIME,sx-8,b-9-sq,16,3); px(SLIME,sx-6,b-11-sq,12,2);
    px(SLIME,sx-4,b-13-sq,8,2); px(SLIME,sx-2,b-14-sq,4,1);
    px(SLIME_D,sx-9,b-1,18,1); px(SLIME_D,sx-9,b-6-sq,1,6+sq); px(SLIME_D,sx+8,b-6-sq,1,6+sq);
    px(SLIME_L,sx-5,b-12-sq,3,2); px(SLIME_L,sx-7,b-9-sq,2,2);
    px("#fff",sx-5,b-9,4,5); px("#fff",sx+2,b-9,4,5); px(EYE,sx-4,b-7,2,3); px(EYE,sx+3,b-7,2,3);
    px("#fff",sx-4,b-7,1,1); px("#fff",sx+3,b-7,1,1); px(CHEEK,sx-7,b-4,2,2); px(CHEEK,sx+6,b-4,2,2); px(EYE,sx-1,b-3,3,1);
    if(crying){ var td=(Math.sin(now/130)>0?0:1), ty=b-6+td;      // deep-blue tears (high contrast on teal) + shine
      px("#0d52b5",sx-5,ty,2,6); px("#0d52b5",sx+4,ty,2,6);
      px("#eaf4ff",sx-5,ty,1,2); px("#eaf4ff",sx+5,ty,1,2);
      px(EYE,sx-2,b-2,1,1); px(EYE,sx-1,b-1,3,1); px(EYE,sx+2,b-2,1,1); }   // down-turned frown
    if(flying){ var fl=Math.sin(now/55)>0?0:2;                     // flapping wings
      px("#eef6ff",sx-14,b-10+fl,5,2); px("#eef6ff",sx-13,b-8+fl,4,2); px("#cfe0f5",sx-14,b-10+fl,2,1);
      px("#eef6ff",sx+9,b-10+fl,5,2); px("#eef6ff",sx+9,b-8+fl,4,2); px("#cfe0f5",sx+12,b-10+fl,2,1); } }
  function drawFlag(){ var sxp=EXIT_X-camX, sy=GY-camY; if(sxp<-20||sxp>LW+20)return;
    var fx=sxp+2, fy=sy-36;
    px("#9a9aa0",sxp,fy,2,36);                                   // pole
    for(var r=0;r<10;r++) px(r%2?"#ffffff":"#b22234", fx, fy+r, 16, 1);   // red/white stripes
    px("#3c3b6e",fx,fy,7,5);                                     // blue canton
    px("#fff",fx+1,fy+1,1,1); px("#fff",fx+3,fy+1,1,1); px("#fff",fx+5,fy+1,1,1);   // stars
    px("#fff",fx+2,fy+3,1,1); px("#fff",fx+4,fy+3,1,1); }
  function drawTreasure(kind,wx,wy){ var sx=Math.round(wx-camX), onSurf=wy<=GY+4;
    var sy=Math.round(wy-camY)-(onSurf?14:0);        // above the grass up top; centered in the tunnel below
    if(sx<-34||sx>LW+34||sy<-36||sy>LH+34) return; var im=toolImg[kind]; if(!im) return;
    var S=20; g.drawImage(im, sx-(S>>1), sy-(S>>1), S, S); }   // static, upright, crisp
  function drawSparks(dt){ for(var i=sparks.length-1;i>=0;i--){ var s=sparks[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=130*dt; s.life-=dt;
    var sx=s.x-camX, sy=s.y-camY; if(s.life>0&&sx>-4&&sx<LW+4) px(s.c,sx,sy,2,2); if(s.life<=0) sparks.splice(i,1); } }

  var last=0, now=0, SPEED=44;
  function frame(ts){ if(!last) last=ts; var dt=Math.min(.05,(ts-last)/1000); last=ts; now=ts;
    if(mode==="walk"){
      if(!paused){ var d=target-hero.dist;
        if(d>0.6){ hero.dist=Math.min(target,hero.dist+(flying?SPEED*2.6:SPEED)*dt); var p=posAt(hero.dist); hero.x=p.x; hero.y=p.y;
          hero.hop=Math.abs(Math.sin(now/(flying?55:95)))*(flying?3:2);
          if(cur===BEATS.length-1 && hero.dist>=nodeDist(EMERGE_NODE)){   // out of the hole → land + hop right of it
            flying=false; var jt=(hero.dist-nodeDist(EMERGE_NODE))/Math.max(1,nodeDist(FLAG_NODE)-nodeDist(EMERGE_NODE));
            hero.hop=Math.sin(Math.min(1,Math.max(0,jt))*Math.PI)*16; } }
        else { hero.dist=target; var q=posAt(target); hero.x=q.x; hero.y=q.y; hero.hop=0; fireBeat(cur); } }
      else hero.hop=0;
    } else if(mode==="fork" && !paused){ ft+=dt;
      if(fphase===1){ hero.x=FC[0]; hero.y=Math.min(STUB[1], hero.y+56*dt); hero.hop=Math.abs(Math.sin(now/95))*2;
        if(hero.y>=STUB[1]-22){ bombExploded=true; crying=true; shake=9; hpTarget=BEATS[FORK_INDEX].dip;   // boom just before the bottom
          burst(STUB[0],STUB[1]-6,"bad"); bombVisible=false; fphase=2; ft=0; } }
      else if(fphase===2){ hero.x=FC[0]; hero.y+=(FC[1]-hero.y)*Math.min(1,dt*5);          // knocked back up (crying)
        if(Math.abs(hero.y-FC[1])<2){ hero.y=FC[1]; fphase=3; ft=0; showForkWait(); updateBtn(); } }
      else if(fphase===3){ /* stop on the "not selected" setback — wait for the player's NEXT tap */ }
      else if(fphase===4){ hero.y=FC[1]; hero.x+=(PICKPOS[0]-hero.x)*Math.min(1,dt*4); hero.hop=Math.abs(Math.sin(now/95))*2;
        if(Math.abs(hero.x-PICKPOS[0])<2){ hero.x=PICKPOS[0]; hero.hop=0; forkWin(); } }
    }
    camX += ((hero.x-LW/2)-camX)*Math.min(1,dt*6); camX=Math.max(0,Math.min(WORLD_W-LW,camX));
    camY += ((hero.y-LH/2)-camY)*Math.min(1,dt*6); camY=Math.max(0,Math.min(WORLD_H-LH,camY));
    hp += (hpTarget-hp)*Math.min(1,dt*3); setHUD();
    shake *= Math.pow(0.001,dt); if(shake<0.15) shake=0;
    if(now<4000) hintEl.style.opacity=String(.85*(1-now/4000)); else hintEl.style.display="none";

    g.save(); if(shake>0) g.translate(Math.round(Math.sin(now/22)*shake),Math.round(Math.cos(now/17)*shake));
    drawWorld();
    if(cur===FORK_INDEX) drawFork();
    for(var i=0;i<BEATS.length;i++){ var b=BEATS[i]; if(b.tool && b.type!=="fork" && !has(b.tool)){ var np=P[b.node];
      drawTreasure(b.tool, np[0], np[1]); } }
    drawFlag(); drawHero(); drawSparks(dt);
    g.restore();
    requestAnimationFrame(frame);
  }

  var jb=parseInt((location.search.match(/[?&]b=(\d+)/)||[])[1],10);
  if(!isNaN(jb)&&jb>0&&jb<BEATS.length){ for(var qi=0;qi<jb;qi++){ if(BEATS[qi].tool) items.push(BEATS[qi].tool); }
    hero.dist=nodeDist(BEATS[jb].node); var pp=posAt(hero.dist); hero.x=pp.x; hero.y=pp.y;
    camX=Math.max(0,Math.min(WORLD_W-LW,hero.x-LW/2)); camY=Math.max(0,Math.min(WORLD_H-LH,hero.y-LH/2));
    staCap = jb>FORK_INDEX?6:(jb>=2?3:0); staCapYear = jb>FORK_INDEX?2022:(jb>=2?2021:2020);
    cur=jb; fireBeat(jb); hp=hpTarget; }
  else { cur=0; target=nodeDist(BEATS[0].node); mode="walk";
    msg.innerHTML="Your journey begins — walk on to collect your <b>OPT</b>…"; ptypeEl.textContent="Begin"; }
  setInv(); setHUD(); updateBtn();
  requestAnimationFrame(frame);
})();
</script>
